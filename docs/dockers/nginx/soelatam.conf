server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M; 
    
    location /api {
        proxy_pass http://host.docker.internal:5000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- CONFIGURACIONES NECESARIAS PARA SSE ---
        
        # 1. Desactivar el buffering para que Nginx pase los datos inmediatamente al frontend
        proxy_buffering off;
        proxy_cache off;

        # 2. Usar HTTP/1.1 (requerido para mantener la conexión abierta en streams)
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # 3. Aumentar el tiempo de espera (timeout)
        # Como tu petición hace múltiples llamados a microservicios, el proceso 
        # completo podría tardar más de los 60 segundos por defecto de Nginx.
        proxy_read_timeout 300s; 
    }

    location / {
        proxy_pass http://host.docker.internal:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}