<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ _('resetingPassword') }}</title>
    <style>
      /* Mantenemos esto para clientes modernos (Gmail, Apple Mail), pero Outlook lo ignorará mayormente */
      * {
        padding: 0;
        border: none;
        margin: 0;
      }
      .btn-action:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body style="background-color: #ffffff; margin: 0; padding: 0">
    <table
      role="presentation"
      border="0"
      cellpadding="0"
      cellspacing="0"
      style="
        width: 100%;
        max-width: 800px;
        margin-top: 1rem;
        margin-left: auto;
        margin-right: auto;
        box-sizing: border-box;
        border-collapse: collapse;
        font-family:
          system-ui,
          -apple-system,
          &quot;Segoe UI&quot;,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      "
    >
      <tr>
        <td
          style="
            background-color: rgb(0, 48, 73);
            padding: 1rem;
            text-align: center;
          "
        >
          <img
            src="cid:logo_soe"
            alt="SOE Logo"
            border="0"
            style="
              max-height: 50px;
              height: auto;
              display: block;
              margin: 0 auto;
            "
          />
        </td>
      </tr>

      <tr>
        <td style="padding: 2rem 1rem">
          <h2
            style="
              margin-bottom: 1.5rem;
              font-weight: normal;
              color: #333333;
              font-family:
                system-ui,
                -apple-system,
                &quot;Segoe UI&quot;,
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            "
          >
            {{ _('resetingPassword') }}
          </h2>

          <p
            style="
              margin-bottom: 1rem;
              color: #333333;
              line-height: 1.5;
              font-family:
                system-ui,
                -apple-system,
                &quot;Segoe UI&quot;,
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            "
          >
            {{ _('requestResetPasswordParagraph') }}
          </p>

          <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            style="margin: 2rem 0"
          >
            <tr>
              <td align="center" bgcolor="#003049" style="border-radius: 4px">
                <a
                  href="{{ link }}"
                  target="_blank"
                  class="btn-action"
                  style="
                    font-size: 16px;
                    font-family:
                      system-ui,
                      -apple-system,
                      &quot;Segoe UI&quot;,
                      Roboto,
                      Helvetica,
                      Arial,
                      sans-serif;
                    color: #ffffff;
                    text-decoration: none;
                    border-radius: 4px;
                    padding: 12px 24px;
                    border: 1px solid #003049;
                    display: inline-block;
                    font-weight: bold;
                  "
                >
                  {{ _('resetPassword') }}
                </a>
              </td>
            </tr>
          </table>
          <p
            style="
              margin-bottom: 0.5rem;
              font-size: 14px;
              color: #555555;
              font-family:
                system-ui,
                -apple-system,
                &quot;Segoe UI&quot;,
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            "
          >
            {{ _('ifButtonDoesntWork') }}
          </p>
          <p
            style="
              margin-bottom: 2rem;
              word-break: break-all;
              font-family:
                system-ui,
                -apple-system,
                &quot;Segoe UI&quot;,
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            "
          >
            <a
              href="{{ link }}"
              style="
                color: rgb(0, 48, 73);
                text-decoration: underline;
                font-weight: bold;
              "
            >
              {{ link }}
            </a>
          </p>

          <p
            style="
              margin-top: 1rem;
              color: #666666;
              font-size: 14px;
              font-family:
                system-ui,
                -apple-system,
                &quot;Segoe UI&quot;,
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            "
          >
            {{ _('ignoreMessageIfNotRequested') }}
          </p>
          <p
            style="
              margin-top: 0.5rem;
              color: #999999;
              font-size: 12px;
              font-style: italic;
              font-family:
                system-ui,
                -apple-system,
                &quot;Segoe UI&quot;,
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            "
          >
            {{ _('thisIsAutomaticMessage') }}
          </p>
        </td>
      </tr>

      <tr>
        <td
          style="
            border-top: 1px solid lightgray;
            font-size: 10px;
            color: gray;
            text-align: center;
            padding: 1rem;
            font-family:
              system-ui,
              -apple-system,
              &quot;Segoe UI&quot;,
              Roboto,
              Helvetica,
              Arial,
              sans-serif;
          "
        >
          © SOE Latam 2026. All rights reserved.
        </td>
      </tr>
    </table>
  </body>
</html>
