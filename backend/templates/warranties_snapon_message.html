<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Processing Warranty with WCO {{ wco }}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      font-family: &quot;Segoe UI&quot;, Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <!-- Contenedor Principal (Garantiza compatibilidad) -->
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="background-color: #f4f6f8; padding: 40px 20px"
    >
      <tr>
        <td align="center">
          <!-- Tarjeta de Contenido -->
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
              box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
              border: 1px solid #e5e7eb;
            "
          >
            <!-- Encabezado / Header con acento visual -->
            <tr>
              <td style="background-color: #0056b3; padding: 24px 32px">
                <h1
                  style="
                    color: #ffffff;
                    margin: 0;
                    font-size: 20px;
                    font-weight: 600;
                  "
                >
                  Warranty Processing
                </h1>
              </td>
            </tr>

            <!-- Cuerpo del mensaje -->
            <tr>
              <td
                style="
                  padding: 32px;
                  color: #333333;
                  font-size: 15px;
                  line-height: 1.6;
                "
              >
                <p style="margin: 0 0 16px 0">Dear Snap-On Team,</p>

                <p style="margin: 0 0 20px 0">
                  Please find attached the PDF corresponding to the warranty
                  processing for
                  <strong style="color: #0056b3">{{ wco }}</strong>.
                </p>

                <!-- Caja destacada para el identificador WCO -->
                <table
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                  width="100%"
                  style="
                    margin: 20px 0;
                    background-color: #f8fafc;
                    border-left: 4px solid #0056b3;
                    border-radius: 0 4px 4px 0;
                  "
                >
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        font-size: 14px;
                        color: #475569;
                      "
                    >
                      {{ wco }}
                    </td>
                  </tr>
                </table>

                <p style="margin: 0">Thank you very much for your attention.</p>
              </td>
            </tr>

            <!-- Pie de página / Footer -->
            <!-- <tr>
              <td
                style="
                  background-color: #f8fafc;
                  padding: 20px 32px;
                  border-top: 1px solid #e5e7eb;
                  font-size: 12px;
                  color: #6b7280;
                  text-align: center;
                "
              >
                This is an automated notification regarding warranty processing.
              </td> -->
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
